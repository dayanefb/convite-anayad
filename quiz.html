<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Quiz da Anayad</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --vinho: #7b1e4f;
      --vinho-escuro: #5d1239;
      --rosa: #a84373;
      --rosa-claro: #f3e2eb;
      --creme: #fdfbf7;
      --texto: #4a1c31;
      --texto-suave: #7c5367;
      --verde: #2f7d62;
      --erro: #a13c5d;
      --ouro: #b88420;
      --branco: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 18px;

      font-family: "Montserrat", sans-serif;
      color: var(--texto);

      background:
        radial-gradient(
          circle at top left,
          rgba(168, 67, 115, 0.15),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f7eee9,
          #ecd8e1 50%,
          #dfbdcd
        );

      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .oculto {
      display: none !important;
    }

    .pagina {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .cabecalho,
    .cartao {
      background: rgba(253, 251, 247, 0.97);
      border: 1px solid rgba(123, 30, 79, 0.15);
      box-shadow: 0 14px 30px rgba(74, 28, 49, 0.09);
    }

    .cabecalho {
      margin-bottom: 18px;
      padding: 44px 24px 32px;

      text-align: center;

      border-radius: 150px 150px 24px 24px;
    }

    .cartao {
      padding: 24px;
      border-radius: 20px;
    }

    .estrelas {
      margin-bottom: 12px;

      color: var(--rosa);

      letter-spacing: 8px;
    }

    h1,
    h2,
    h3 {
      color: var(--vinho);
      font-family: "Cormorant Garamond", serif;
    }

    h1 {
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      line-height: 0.95;
    }

    h2 {
      font-size: 2rem;
    }

    .subtitulo {
      margin: 12px auto;

      color: var(--texto-suave);

      font-size: 0.77rem;
      line-height: 1.7;
    }

    .centralizado {
      text-align: center;
    }

    .campo {
      margin-top: 20px;
      text-align: left;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;

      color: var(--vinho-escuro);

      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .campo input {
      width: 100%;
      min-height: 50px;
      padding: 13px;

      border: 1px solid rgba(123, 30, 79, 0.23);
      border-radius: 10px;

      outline: none;
    }

    .campo input:focus {
      border-color: var(--vinho);
      box-shadow: 0 0 0 3px rgba(123, 30, 79, 0.08);
    }

    .botao {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      padding: 12px;

      color: #ffffff;
      background: var(--vinho);

      border: 1px solid var(--vinho);
      border-radius: 999px;

      font-weight: 600;
      text-transform: uppercase;
    }

    .sala-topo {
      margin-bottom: 18px;
      text-align: center;
    }

    .participantes {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(150px, 1fr)
      );
      gap: 10px;
      margin-top: 18px;
    }

    .participante {
      padding: 12px 14px;

      display: flex;
      align-items: center;
      gap: 9px;

      background: #ffffff;

      border: 1px solid rgba(123, 30, 79, 0.13);
      border-radius: 13px;

      font-size: 0.72rem;
      font-weight: 600;
    }

    .participante::before {
      content: "";

      width: 9px;
      height: 9px;

      flex: 0 0 auto;

      background: var(--verde);
      border-radius: 50%;
    }

    .contador-participantes {
      display: inline-flex;
      margin-top: 10px;
      padding: 7px 12px;

      color: var(--vinho);
      background: var(--rosa-claro);

      border-radius: 999px;

      font-size: 0.65rem;
      font-weight: 600;
    }

    .topo-pergunta {
      margin-bottom: 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tempo {
      min-width: 78px;
      padding: 9px 14px;

      color: var(--vinho);
      background: var(--rosa-claro);

      border-radius: 999px;

      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
    }

    .imagem-pergunta {
      width: 100%;
      max-height: 360px;
      margin-bottom: 18px;

      object-fit: contain;

      background: #ffffff;

      border-radius: 14px;
    }

    .pergunta {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      line-height: 1.05;
    }

    .alternativas {
      margin-top: 20px;

      display: grid;
      gap: 11px;
    }

    .alternativa {
      min-height: 56px;
      padding: 13px 15px;

      color: var(--texto);
      background: #ffffff;

      border: 1px solid rgba(123, 30, 79, 0.18);
      border-radius: 13px;

      text-align: left;

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background-color 0.18s ease;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(123, 30, 79, 0.42);
    }

    .alternativa.marcada {
      color: #ffffff;
      background: var(--vinho);
      border-color: var(--vinho);
    }

    .alternativa.correta {
      color: #ffffff;
      background: var(--verde);
      border-color: var(--verde);
    }

    .alternativa.errada {
      color: #ffffff;
      background: var(--erro);
      border-color: var(--erro);
    }

    .resposta-revelada {
      margin-top: 16px;
      padding: 16px;

      color: var(--verde);
      background: #e9f6f1;

      border-radius: 13px;

      font-size: 0.76rem;
      font-weight: 600;
      line-height: 1.55;
      text-align: center;
    }

    .pontuacao-recebida {
      display: block;
      margin-top: 5px;

      color: var(--vinho);
    }

    .mensagem {
      display: none;
      margin-top: 14px;
      padding: 13px;

      border-radius: 9px;

      font-size: 0.72rem;
      line-height: 1.55;
    }

    .mensagem.erro {
      display: block;
      color: var(--erro);
      background: #ffe4ec;
    }

    .mensagem.sucesso {
      display: block;
      color: var(--verde);
      background: #e9f6f1;
    }

    .ranking {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .linha-ranking {
      padding: 13px 15px;

      display: grid;
      grid-template-columns:
        44px
        minmax(0, 1fr)
        auto
        auto;
      gap: 10px;
      align-items: center;

      background: #ffffff;

      border: 1px solid rgba(123, 30, 79, 0.12);
      border-radius: 13px;
    }

    .posicao {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      color: var(--vinho);
      background: var(--rosa-claro);

      border-radius: 50%;

      font-weight: 700;
    }

    .linha-ranking:first-child {
      border-color: rgba(184, 132, 32, 0.4);
      box-shadow: 0 8px 20px rgba(184, 132, 32, 0.12);
    }

    .linha-ranking:first-child .posicao {
      color: #ffffff;
      background: var(--ouro);
    }

    .nome-ranking {
      min-width: 0;

      font-size: 0.75rem;
      font-weight: 600;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dados-ranking {
      color: var(--texto-suave);

      font-size: 0.64rem;
      white-space: nowrap;
    }

    .pontos-ranking {
      color: var(--vinho);

      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      body {
        padding: 10px;
      }

      .cartao {
        padding: 18px;
      }

      .linha-ranking {
        grid-template-columns:
          38px
          minmax(0, 1fr)
          auto;
      }

      .dados-ranking {
        grid-column: 2 / -1;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">
    <section class="cabecalho">
      <div class="estrelas">✦ ✷ ✦</div>

      <h1>Quiz da Anayad</h1>

      <p class="subtitulo">
        Responda rápido para ganhar mais pontos.
        Cada pergunta vale de 1 a 5 pontos.
      </p>
    </section>

    <section
      class="cartao centralizado"
      id="telaNome"
    >
      <h2>Entrar na sala</h2>

      <p class="subtitulo">
        Digite seu nome para participar.
      </p>

      <div class="campo">
        <label for="nome">Seu nome</label>

        <input
          id="nome"
          maxlength="100"
          placeholder="Digite seu nome"
          autocomplete="name"
        >
      </div>

      <button
        class="botao"
        id="entrar"
        type="button"
      >
        Entrar no quiz
      </button>

      <p
        class="mensagem"
        id="mensagemNome"
      ></p>
    </section>

    <section
      class="cartao oculto"
      id="telaSala"
    >
      <div class="sala-topo">
        <h2>Sala de espera</h2>

        <p class="subtitulo">
          Aguarde a organização iniciar o quiz.
        </p>

        <span
          class="contador-participantes"
          id="contadorParticipantes"
        >
          0 participantes
        </span>
      </div>

      <div
        class="participantes"
        id="listaParticipantes"
      ></div>
    </section>

    <section
      class="cartao oculto"
      id="telaPergunta"
    >
      <div class="topo-pergunta">
        <span
          class="subtitulo"
          id="statusPergunta"
        ></span>

        <span
          class="tempo"
          id="tempo"
        >
          00
        </span>
      </div>

      <img
        class="imagem-pergunta oculto"
        id="imagemPergunta"
        alt=""
      >

      <h2
        class="pergunta"
        id="pergunta"
      ></h2>

      <div
        class="alternativas"
        id="alternativas"
      ></div>

      <p
        class="mensagem"
        id="mensagemPergunta"
      ></p>

      <div
        class="resposta-revelada oculto"
        id="respostaRevelada"
      ></div>
    </section>

    <section
      class="cartao centralizado oculto"
      id="telaFim"
    >
      <h2>Quiz finalizado</h2>

      <p class="subtitulo">
        Confira o resultado final.
      </p>

      <div
        class="ranking"
        id="ranking"
      ></div>

      <p
        class="mensagem"
        id="mensagemRanking"
      ></p>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://ywkgwctaaipwcyohomdj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zLcSs35Cps1zW0ncBW5qxw_zv-c3Ekt";

    const clienteSupabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const obterElemento =
      (id) =>
        document.getElementById(id);

    let participanteId =
      localStorage.getItem(
        "quiz_participante_id"
      ) || "";

    let participanteNome =
      localStorage.getItem(
        "quiz_participante_nome"
      ) || "";

    let perguntaAtualId =
      null;

    let perguntaAtual =
      null;

    let inicioPergunta =
      0;

    let respondeu =
      false;

    let alternativaEscolhida =
      null;

    let pontosRecebidos =
      null;

    let faseAtual =
      "";

    obterElemento("entrar")
      .addEventListener(
        "click",
        entrarNaSala
      );

    setInterval(
      sincronizarQuiz,
      700
    );

    setInterval(
      carregarParticipantes,
      2000
    );

    iniciarParticipante();

    async function iniciarParticipante() {
      if (!participanteId) {
        mostrarTelaNome();
        return;
      }

      const participanteValido =
        await validarParticipanteSalvo();

      if (!participanteValido) {
        limparParticipanteLocal();
        mostrarTelaNome();
        return;
      }

      obterElemento("telaNome")
        .classList.add("oculto");

      mostrarTela("sala");

      await sincronizarQuiz();
      await carregarParticipantes();
    }

    async function validarParticipanteSalvo() {
      const { data, error } =
        await clienteSupabase.rpc(
          "obter_participantes_sala"
        );

      if (error) {
        console.error(
          "Erro ao validar participante:",
          error
        );

        return false;
      }

      return (data || []).some(
        function (participante) {
          return participante.id ===
            participanteId;
        }
      );
    }

    function limparParticipanteLocal() {
      participanteId =
        "";

      participanteNome =
        "";

      localStorage.removeItem(
        "quiz_participante_id"
      );

      localStorage.removeItem(
        "quiz_participante_nome"
      );
    }

    function mostrarTelaNome() {
      [
        "telaSala",
        "telaPergunta",
        "telaFim"
      ].forEach(
        function (id) {
          obterElemento(id)
            .classList.add("oculto");
        }
      );

      obterElemento("telaNome")
        .classList.remove("oculto");

      obterElemento("nome")
        .focus();
    }

    async function entrarNaSala() {
      const nome =
        obterElemento("nome")
          .value
          .trim();

      limparMensagem(
        obterElemento("mensagemNome")
      );

      if (nome.length < 2) {
        mostrarMensagem(
          obterElemento("mensagemNome"),
          "Digite seu nome para entrar.",
          "erro"
        );

        return;
      }

      const { data, error } =
        await clienteSupabase.rpc(
          "entrar_sala_quiz",
          {
            p_nome:
              nome
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        mostrarMensagem(
          obterElemento("mensagemNome"),
          error?.message ||
            "Não foi possível entrar na sala.",
          "erro"
        );

        return;
      }

      participanteId =
        data[0].id;

      participanteNome =
        data[0].nome;

      localStorage.setItem(
        "quiz_participante_id",
        participanteId
      );

      localStorage.setItem(
        "quiz_participante_nome",
        participanteNome
      );

      obterElemento("telaNome")
        .classList.add("oculto");

      mostrarTela("sala");

      await carregarParticipantes();
      await sincronizarQuiz();
    }

    async function sincronizarQuiz() {
      if (!participanteId) {
        return;
      }

      await clienteSupabase.rpc(
        "atualizar_estado_por_tempo"
      );

      const { data, error } =
        await clienteSupabase.rpc(
          "obter_estado_quiz"
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      const estado =
        data[0];

      faseAtual =
        estado.fase;

      if (
        estado.status ===
        "finalizado"
      ) {
        perguntaAtualId =
          null;

        mostrarTela("fim");

        await carregarRanking();
        return;
      }

      if (
        estado.status ===
        "aguardando"
      ) {
        perguntaAtualId =
          null;

        mostrarTela("sala");
        return;
      }

      if (
        estado.status ===
          "em_andamento" &&
        estado.pergunta_atual_id
      ) {
        if (
          perguntaAtualId !==
          estado.pergunta_atual_id
        ) {
          perguntaAtualId =
            estado.pergunta_atual_id;

          inicioPergunta =
            new Date(
              estado.iniciada_em
            ).getTime();

          respondeu =
            false;

          alternativaEscolhida =
            null;

          pontosRecebidos =
            null;

          await carregarPergunta(
            perguntaAtualId
          );
        }

        mostrarTela("pergunta");

        if (
          estado.fase ===
          "pergunta"
        ) {
          atualizarCronometro(
            estado
          );
        }

        if (
          estado.fase ===
          "resposta"
        ) {
          await revelarResposta();
        }
      }
    }

    async function carregarParticipantes() {
      if (!participanteId) {
        return;
      }

      const { data, error } =
        await clienteSupabase.rpc(
          "obter_participantes_sala"
        );

      if (error) {
        return;
      }

      const participantes =
        data || [];

      if (
        participanteId &&
        !participantes.some(
          function (participante) {
            return participante.id ===
              participanteId;
          }
        )
      ) {
        limparParticipanteLocal();
        mostrarTelaNome();
        return;
      }

      const lista =
        obterElemento(
          "listaParticipantes"
        );

      lista.innerHTML =
        "";

      participantes.forEach(
        function (participante) {
          const item =
            document.createElement(
              "div"
            );

          item.className =
            "participante";

          item.textContent =
            participante.nome;

          lista.appendChild(
            item
          );
        }
      );

      obterElemento(
        "contadorParticipantes"
      ).textContent =
        `${participantes.length} ${
          participantes.length === 1
            ? "participante"
            : "participantes"
        }`;
    }

    async function carregarPergunta(id) {
      const { data, error } =
        await clienteSupabase.rpc(
          "obter_pergunta_publica",
          {
            p_pergunta_id:
              id
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      perguntaAtual =
        data[0];

      obterElemento(
        "pergunta"
      ).textContent =
        perguntaAtual.pergunta;

      obterElemento(
        "statusPergunta"
      ).textContent =
        `Esta pergunta vale até 5 pontos`;

      const imagem =
        obterElemento(
          "imagemPergunta"
        );

      if (
        perguntaAtual.imagem_url
      ) {
        imagem.src =
          perguntaAtual.imagem_url;

        imagem.classList.remove(
          "oculto"
        );
      } else {
        imagem.classList.add(
          "oculto"
        );
      }

      const listaAlternativas =
        obterElemento(
          "alternativas"
        );

      listaAlternativas.innerHTML =
        "";

      perguntaAtual.alternativas.forEach(
        function (
          texto,
          indice
        ) {
          const botao =
            document.createElement(
              "button"
            );

          botao.type =
            "button";

          botao.className =
            "alternativa";

          botao.dataset.indice =
            indice;

          botao.textContent =
            texto;

          botao.addEventListener(
            "click",
            function () {
              responderPergunta(
                indice,
                botao
              );
            }
          );

          listaAlternativas
            .appendChild(botao);
        }
      );

      obterElemento(
        "respostaRevelada"
      ).classList.add(
        "oculto"
      );

      limparMensagem(
        obterElemento(
          "mensagemPergunta"
        )
      );
    }

    function atualizarCronometro(
      estado
    ) {
      if (!perguntaAtual) {
        return;
      }

      const inicio =
        new Date(
          estado.iniciada_em
        ).getTime();

      const decorrido =
        Math.floor(
          (
            Date.now() -
            inicio
          ) / 1000
        );

      const restante =
        Math.max(
          0,
          perguntaAtual.tempo_segundos -
            decorrido
        );

      obterElemento(
        "tempo"
      ).textContent =
        String(restante).padStart(
          2,
          "0"
        );

      if (
        restante <= 0
      ) {
        bloquearAlternativas();
      }
    }

    async function responderPergunta(
      indice,
      botao
    ) {
      if (
        respondeu ||
        faseAtual !== "pergunta"
      ) {
        return;
      }

      respondeu =
        true;

      alternativaEscolhida =
        indice;

      bloquearAlternativas();

      botao.classList.add(
        "marcada"
      );

      const { data, error } =
        await clienteSupabase.rpc(
          "responder_quiz",
          {
            p_participante_id:
              participanteId,

            p_pergunta_id:
              perguntaAtualId,

            p_alternativa_indice:
              indice
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        const detalhe =
          error?.message || "";

        if (
          detalhe.includes(
            "quiz_respostas_participante_id_fkey"
          ) ||
          detalhe.includes(
            "Participante inválido"
          )
        ) {
          limparParticipanteLocal();
          mostrarTelaNome();

          mostrarMensagem(
            obterElemento(
              "mensagemNome"
            ),
            "Sua entrada anterior foi reiniciada. Digite seu nome novamente para entrar na sala.",
            "erro"
          );

          return;
        }

        mostrarMensagem(
          obterElemento(
            "mensagemPergunta"
          ),
          detalhe ||
            "Não foi possível salvar a resposta.",
          "erro"
        );

        return;
      }

      pontosRecebidos =
        data[0].pontos;

      mostrarMensagem(
        obterElemento(
          "mensagemPergunta"
        ),
        `Resposta registrada. Você recebeu ${pontosRecebidos} ${
          pontosRecebidos === 1
            ? "ponto"
            : "pontos"
        }.`,
        data[0].acertou
          ? "sucesso"
          : "erro"
      );
    }

    async function revelarResposta() {
      bloquearAlternativas();

      const { data, error } =
        await clienteSupabase.rpc(
          "obter_resposta_correta",
          {
            p_pergunta_id:
              perguntaAtualId
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      const resposta =
        data[0];

      document
        .querySelectorAll(
          ".alternativa"
        )
        .forEach(
          function (botao) {
            const indice =
              Number(
                botao.dataset.indice
              );

            botao.classList.remove(
              "correta",
              "errada"
            );

            if (
              indice ===
              resposta.correta
            ) {
              botao.classList.add(
                "correta"
              );
            } else if (
              alternativaEscolhida ===
              indice
            ) {
              botao.classList.add(
                "errada"
              );
            }
          }
        );

      const area =
        obterElemento(
          "respostaRevelada"
        );

      area.innerHTML =
        `Resposta correta: <strong>${escaparHtml(
          resposta.alternativa_texto
        )}</strong>`;

      if (
        pontosRecebidos !== null
      ) {
        area.innerHTML +=
          `<span class="pontuacao-recebida">Você recebeu ${pontosRecebidos} ${
            pontosRecebidos === 1
              ? "ponto"
              : "pontos"
          }.</span>`;
      }

      area.classList.remove(
        "oculto"
      );

      obterElemento(
        "tempo"
      ).textContent =
        "00";
    }

    async function carregarRanking() {
      const { data, error } =
        await clienteSupabase.rpc(
          "obter_ranking_quiz"
        );

      const lista =
        obterElemento(
          "ranking"
        );

      lista.innerHTML =
        "";

      if (error) {
        mostrarMensagem(
          obterElemento(
            "mensagemRanking"
          ),
          error.message,
          "erro"
        );

        return;
      }

      const ranking =
        data || [];

      if (!ranking.length) {
        lista.innerHTML =
          '<p class="subtitulo">Nenhum resultado registrado.</p>';

        return;
      }

      ranking.forEach(
        function (
          resultado,
          indice
        ) {
          const linha =
            document.createElement(
              "article"
            );

          linha.className =
            "linha-ranking";

          linha.innerHTML =
            `
              <span class="posicao">
                ${indice + 1}
              </span>

              <span class="nome-ranking"></span>

              <span class="pontos-ranking">
                ${resultado.pontos} pts
              </span>

              <span class="dados-ranking">
                ${resultado.acertos} acertos
              </span>
            `;

          linha.querySelector(
            ".nome-ranking"
          ).textContent =
            resultado.nome;

          lista.appendChild(
            linha
          );
        }
      );
    }

    function bloquearAlternativas() {
      document
        .querySelectorAll(
          ".alternativa"
        )
        .forEach(
          function (botao) {
            botao.disabled =
              true;
          }
        );
    }

    function mostrarTela(tipo) {
      [
        "telaSala",
        "telaPergunta",
        "telaFim"
      ].forEach(
        function (id) {
          obterElemento(id)
            .classList.add(
              "oculto"
            );
        }
      );

      if (tipo === "sala") {
        obterElemento(
          "telaSala"
        ).classList.remove(
          "oculto"
        );
      }

      if (tipo === "pergunta") {
        obterElemento(
          "telaPergunta"
        ).classList.remove(
          "oculto"
        );
      }

      if (tipo === "fim") {
        obterElemento(
          "telaFim"
        ).classList.remove(
          "oculto"
        );
      }
    }

    function mostrarMensagem(
      elemento,
      texto,
      tipo
    ) {
      elemento.textContent =
        texto;

      elemento.className =
        `mensagem ${tipo}`;
    }

    function limparMensagem(
      elemento
    ) {
      elemento.textContent =
        "";

      elemento.className =
        "mensagem";
    }

    function escaparHtml(texto) {
      const elemento =
        document.createElement(
          "div"
        );

      elemento.textContent =
        texto;

      return elemento.innerHTML;
    }
  </script>
</body>
</html>
