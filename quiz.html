<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Quiz da Anayad</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --vinho: #7b1e4f;
      --vinho-escuro: #5d1239;
      --rosa: #a84373;
      --rosa-claro: #f3e2eb;
      --creme: #fdfbf7;
      --texto: #4a1c31;
      --texto-suave: #7c5367;
      --verde: #2f7d62;
      --erro: #a13c5d;
      --ouro: #b88420;
      --branco: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 18px;

      font-family: "Montserrat", sans-serif;
      color: var(--texto);

      background:
        radial-gradient(
          circle at top left,
          rgba(168, 67, 115, 0.15),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f7eee9,
          #ecd8e1 50%,
          #dfbdcd
        );

      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .oculto {
      display: none !important;
    }

    .pagina {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .cabecalho,
    .cartao {
      background: rgba(253, 251, 247, 0.97);
      border: 1px solid rgba(123, 30, 79, 0.15);
      box-shadow: 0 14px 30px rgba(74, 28, 49, 0.09);
    }

    .cabecalho {
      margin-bottom: 18px;
      padding: 44px 24px 32px;
      text-align: center;
      border-radius: 150px 150px 24px 24px;
    }

    .cartao {
      padding: 24px;
      border-radius: 20px;
    }

    .cartao + .cartao {
      margin-top: 18px;
    }

    .estrelas {
      margin-bottom: 12px;
      color: var(--rosa);
      letter-spacing: 8px;
    }

    h1,
    h2,
    h3 {
      color: var(--vinho);
      font-family: "Cormorant Garamond", serif;
    }

    h1 {
      font-size: clamp(2.8rem, 9vw, 4.8rem);
      line-height: 0.95;
    }

    h2 {
      font-size: 2rem;
    }

    .subtitulo {
      margin: 12px auto;
      color: var(--texto-suave);
      font-size: 0.77rem;
      line-height: 1.7;
    }

    .centralizado {
      text-align: center;
    }

    .campo {
      margin-top: 20px;
      text-align: left;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      color: var(--vinho-escuro);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .campo input {
      width: 100%;
      min-height: 50px;
      padding: 13px;
      border: 1px solid rgba(123, 30, 79, 0.23);
      border-radius: 10px;
      outline: none;
    }

    .botao {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      padding: 12px;
      color: #ffffff;
      background: var(--vinho);
      border: 1px solid var(--vinho);
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .participantes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .participante {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: #ffffff;
      border: 1px solid rgba(123, 30, 79, 0.13);
      border-radius: 13px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .participante::before {
      content: "";
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      background: var(--verde);
      border-radius: 50%;
    }

    .topo-pergunta {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .tempo {
      min-width: 78px;
      padding: 9px 14px;
      color: var(--vinho);
      background: var(--rosa-claro);
      border-radius: 999px;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
    }

    .imagem-pergunta {
      width: 100%;
      max-height: 360px;
      margin-bottom: 18px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 14px;
    }

    .pergunta {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      line-height: 1.05;
    }

    .alternativas {
      margin-top: 20px;
      display: grid;
      gap: 11px;
    }

    .alternativa {
      min-height: 56px;
      padding: 13px 15px;
      color: var(--texto);
      background: #ffffff;
      border: 1px solid rgba(123, 30, 79, 0.18);
      border-radius: 13px;
      text-align: left;
    }

    .alternativa.marcada {
      color: #ffffff;
      background: var(--vinho);
      border-color: var(--vinho);
    }

    .alternativa.correta {
      color: #ffffff;
      background: var(--verde);
      border-color: var(--verde);
    }

    .alternativa.errada {
      color: #ffffff;
      background: var(--erro);
      border-color: var(--erro);
    }

    .resposta {
      margin-top: 16px;
      padding: 16px;
      color: var(--verde);
      background: #e9f6f1;
      border-radius: 13px;
      font-size: 0.76rem;
      font-weight: 600;
      line-height: 1.55;
      text-align: center;
    }

    .mensagem {
      display: none;
      margin-top: 14px;
      padding: 13px;
      border-radius: 9px;
      font-size: 0.72rem;
      line-height: 1.55;
    }

    .mensagem.erro {
      display: block;
      color: var(--erro);
      background: #ffe4ec;
    }

    .mensagem.sucesso {
      display: block;
      color: var(--verde);
      background: #e9f6f1;
    }

    .ranking {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .linha-ranking {
      padding: 13px 15px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      background: #ffffff;
      border: 1px solid rgba(123, 30, 79, 0.12);
      border-radius: 13px;
    }

    .posicao {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--vinho);
      background: var(--rosa-claro);
      border-radius: 50%;
      font-weight: 700;
    }

    .linha-ranking:first-child .posicao {
      color: #ffffff;
      background: var(--ouro);
    }

    .nome-ranking {
      min-width: 0;
      font-size: 0.75rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pontos-ranking {
      color: var(--vinho);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .dados-ranking {
      color: var(--texto-suave);
      font-size: 0.64rem;
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      body {
        padding: 10px;
      }

      .cartao {
        padding: 18px;
      }

      .linha-ranking {
        grid-template-columns: 38px minmax(0, 1fr) auto;
      }

      .dados-ranking {
        grid-column: 2 / -1;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">
    <section class="cabecalho">
      <div class="estrelas">✦ ✷ ✦</div>
      <h1>Quiz da Anayad</h1>
      <p class="subtitulo" id="descricaoModo">
        Digite seu nome para participar.
      </p>
    </section>

    <section class="cartao centralizado" id="telaNome">
      <h2>Participar</h2>

      <div class="campo">
        <label for="nome">Seu nome</label>
        <input
          id="nome"
          maxlength="100"
          placeholder="Digite seu nome"
          autocomplete="name"
        >
      </div>

      <button class="botao" id="entrar" type="button">
        Entrar no quiz
      </button>

      <p class="mensagem" id="mensagemNome"></p>
    </section>

    <section class="cartao centralizado oculto" id="telaSala">
      <h2>Sala de espera</h2>
      <p class="subtitulo">Aguarde a organização iniciar.</p>
      <div class="participantes" id="listaParticipantes"></div>
    </section>

    <section class="cartao oculto" id="telaPergunta">
      <div class="topo-pergunta">
        <span class="subtitulo" id="statusPergunta"></span>
        <span class="tempo" id="tempo">00</span>
      </div>

      <img class="imagem-pergunta oculto" id="imagemPergunta" alt="">
      <h2 class="pergunta" id="pergunta"></h2>
      <div class="alternativas" id="alternativas"></div>
      <p class="mensagem" id="mensagemPergunta"></p>
      <div class="resposta oculto" id="respostaCorreta"></div>
    </section>

    <section class="cartao centralizado oculto" id="telaFim">
      <h2>Você terminou!</h2>
      <p class="subtitulo">Confira sua posição no ranking.</p>
    </section>

    <section class="cartao oculto" id="secaoRanking">
      <h2>Ranking</h2>
      <p class="subtitulo">
        A classificação é atualizada conforme as respostas chegam.
      </p>
      <div class="ranking" id="ranking"></div>
      <p class="mensagem" id="mensagemRanking"></p>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://ywkgwctaaipwcyohomdj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zLcSs35Cps1zW0ncBW5qxw_zv-c3Ekt";

    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const $ =
      (id) =>
        document.getElementById(id);

    let configuracao =
      {
        modo:
          "sala",

        mostrar_ranking_durante:
          true,

        segundos_resposta_correta:
          2
      };

    let participanteId =
      localStorage.getItem(
        "quiz_participante_id"
      ) || "";

    let perguntaAtual =
      null;

    let perguntaAtualId =
      null;

    let inicioPergunta =
      null;

    let respondeu =
      false;

    let alternativaEscolhida =
      null;

    let pontosRecebidos =
      null;

    let faseSala =
      "";

    let avancando =
      false;

    $("entrar")
      .addEventListener(
        "click",
        entrar
      );

    iniciar();

    setInterval(
      sincronizar,
      700
    );

    setInterval(
      carregarRanking,
      2000
    );

    setInterval(
      carregarParticipantes,
      2000
    );

    async function iniciar() {
      await carregarConfiguracao();

      if (!participanteId) {
        mostrarTelaNome();
        return;
      }

      const valido =
        await participanteExiste();

      if (!valido) {
        limparParticipante();
        mostrarTelaNome();
        return;
      }

      $("telaNome")
        .classList.add(
          "oculto"
        );

      await sincronizar();
    }

    async function carregarConfiguracao() {
      const { data, error } =
        await sb.rpc(
          "obter_configuracao_quiz"
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      configuracao =
        data[0];

      $("descricaoModo")
        .textContent =
          configuracao.modo ===
          "sala"
            ? "Entre na sala e aguarde a organização iniciar."
            : "Entre e comece imediatamente. O ranking muda a cada resposta.";
    }

    async function participanteExiste() {
      const { data } =
        await sb.rpc(
          "obter_participantes_sala"
        );

      return (data || [])
        .some(
          (participante) =>
            participante.id ===
            participanteId
        );
    }

    async function entrar() {
      const nome =
        $("nome")
          .value
          .trim();

      limparMensagem(
        $("mensagemNome")
      );

      if (nome.length < 2) {
        mensagem(
          $("mensagemNome"),
          "Digite seu nome.",
          "erro"
        );

        return;
      }

      const { data, error } =
        await sb.rpc(
          "entrar_quiz",
          {
            p_nome:
              nome
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        mensagem(
          $("mensagemNome"),
          error?.message ||
            "Não foi possível entrar.",
          "erro"
        );

        return;
      }

      participanteId =
        data[0].participante_id;

      localStorage.setItem(
        "quiz_participante_id",
        participanteId
      );

      $("telaNome")
        .classList.add(
          "oculto"
        );

      await carregarConfiguracao();
      await sincronizar();
    }

    async function sincronizar() {
      if (!participanteId) {
        return;
      }

      await carregarConfiguracao();

      if (
        configuracao.modo ===
        "individual"
      ) {
        await sincronizarIndividual();
      } else {
        await sincronizarSala();
      }

      if (
        configuracao.modo ===
          "individual" &&
        configuracao
          .mostrar_ranking_durante
      ) {
        $("secaoRanking")
          .classList.remove(
            "oculto"
          );
      }
    }

    async function sincronizarIndividual() {
      const { data, error } =
        await sb.rpc(
          "obter_situacao_participante",
          {
            p_participante_id:
              participanteId
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      const situacao =
        data[0];

      if (
        situacao.finalizado
      ) {
        mostrarTela("fim");

        $("secaoRanking")
          .classList.remove(
            "oculto"
          );

        await carregarRanking();
        return;
      }

      if (
        situacao.pergunta_atual_id &&
        perguntaAtualId !==
          situacao.pergunta_atual_id &&
        !avancando
      ) {
        perguntaAtualId =
          situacao.pergunta_atual_id;

        inicioPergunta =
          new Date(
            situacao.iniciada_em
          ).getTime();

        respondeu =
          false;

        alternativaEscolhida =
          null;

        pontosRecebidos =
          null;

        await carregarPergunta(
          perguntaAtualId
        );
      }

      mostrarTela(
        "pergunta"
      );

      atualizarCronometroIndividual();
    }

    async function sincronizarSala() {
      await sb.rpc(
        "atualizar_estado_por_tempo"
      );

      const { data, error } =
        await sb.rpc(
          "obter_estado_quiz"
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      const estado =
        data[0];

      faseSala =
        estado.fase;

      if (
        estado.status ===
        "aguardando"
      ) {
        perguntaAtualId =
          null;

        mostrarTela("sala");
        await carregarParticipantes();
        return;
      }

      if (
        estado.status ===
        "finalizado"
      ) {
        mostrarTela("fim");

        $("secaoRanking")
          .classList.remove(
            "oculto"
          );

        await carregarRanking();
        return;
      }

      if (
        estado.pergunta_atual_id &&
        perguntaAtualId !==
          estado.pergunta_atual_id
      ) {
        perguntaAtualId =
          estado.pergunta_atual_id;

        inicioPergunta =
          new Date(
            estado.iniciada_em
          ).getTime();

        respondeu =
          false;

        alternativaEscolhida =
          null;

        pontosRecebidos =
          null;

        await carregarPergunta(
          perguntaAtualId
        );
      }

      mostrarTela("pergunta");

      if (
        estado.fase ===
        "pergunta"
      ) {
        atualizarCronometroSala(
          estado
        );
      }

      if (
        estado.fase ===
        "resposta"
      ) {
        await revelarRespostaSala();
      }
    }

    async function carregarPergunta(
      perguntaId
    ) {
      const { data, error } =
        await sb.rpc(
          "obter_pergunta_publica",
          {
            p_pergunta_id:
              perguntaId
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        return;
      }

      perguntaAtual =
        data[0];

      $("pergunta")
        .textContent =
          perguntaAtual.pergunta;

      $("statusPergunta")
        .textContent =
          "Vale até 5 pontos";

      const imagem =
        $("imagemPergunta");

      if (
        perguntaAtual.imagem_url
      ) {
        imagem.src =
          perguntaAtual.imagem_url;

        imagem.classList.remove(
          "oculto"
        );
      } else {
        imagem.classList.add(
          "oculto"
        );
      }

      const alternativas =
        $("alternativas");

      alternativas.innerHTML =
        "";

      perguntaAtual.alternativas
        .forEach(
          function (
            texto,
            indice
          ) {
            const botao =
              document.createElement(
                "button"
              );

            botao.className =
              "alternativa";

            botao.type =
              "button";

            botao.dataset.indice =
              indice;

            botao.textContent =
              texto;

            botao.addEventListener(
              "click",
              function () {
                responder(
                  indice,
                  botao
                );
              }
            );

            alternativas.appendChild(
              botao
            );
          }
        );

      $("respostaCorreta")
        .classList.add(
          "oculto"
        );

      limparMensagem(
        $("mensagemPergunta")
      );
    }

    async function responder(
      indice,
      botao
    ) {
      if (respondeu) {
        return;
      }

      if (
        configuracao.modo ===
          "sala" &&
        faseSala !==
          "pergunta"
      ) {
        return;
      }

      respondeu =
        true;

      alternativaEscolhida =
        indice;

      bloquearAlternativas();

      botao.classList.add(
        "marcada"
      );

      if (
        configuracao.modo ===
        "individual"
      ) {
        await responderIndividual(
          indice
        );
      } else {
        await responderSala(
          indice
        );
      }
    }

    async function responderIndividual(
      indice
    ) {
      avancando =
        true;

      const { data, error } =
        await sb.rpc(
          "responder_quiz_individual",
          {
            p_participante_id:
              participanteId,

            p_pergunta_id:
              perguntaAtualId,

            p_alternativa_indice:
              indice
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        avancando =
          false;

        mensagem(
          $("mensagemPergunta"),
          error?.message ||
            "Não foi possível salvar.",
          "erro"
        );

        return;
      }

      const resposta =
        data[0];

      pontosRecebidos =
        resposta.pontos;

      mostrarRespostaLocal(
        resposta.correta,
        resposta.alternativa_correta,
        resposta.acertou,
        resposta.pontos
      );

      await carregarRanking();

      setTimeout(
        async function () {
          perguntaAtualId =
            null;

          perguntaAtual =
            null;

          avancando =
            false;

          if (
            resposta.finalizado
          ) {
            mostrarTela("fim");

            $("secaoRanking")
              .classList.remove(
                "oculto"
              );

            await carregarRanking();
          } else {
            await sincronizarIndividual();
          }
        },
        configuracao
          .segundos_resposta_correta *
          1000
      );
    }

    async function responderSala(
      indice
    ) {
      const { data, error } =
        await sb.rpc(
          "responder_quiz_ao_vivo",
          {
            p_participante_id:
              participanteId,

            p_pergunta_id:
              perguntaAtualId,

            p_alternativa_indice:
              indice
          }
        );

      if (
        error ||
        !data ||
        !data.length
      ) {
        mensagem(
          $("mensagemPergunta"),
          error?.message ||
            "Não foi possível salvar.",
          "erro"
        );

        return;
      }

      pontosRecebidos =
        data[0].pontos;

      mensagem(
        $("mensagemPergunta"),
        `Resposta registrada: ${pontosRecebidos} pontos.`,
        data[0].acertou
          ? "sucesso"
          : "erro"
      );
    }

    function mostrarRespostaLocal(
      correta,
      textoCorreto,
      acertou,
      pontos
    ) {
      document
        .querySelectorAll(
          ".alternativa"
        )
        .forEach(
          function (botao) {
            const indice =
              Number(
                botao.dataset.indice
              );

            if (
              indice ===
              correta
            ) {
              botao.classList.add(
                "correta"
              );
            } else if (
              indice ===
              alternativaEscolhida
            ) {
              botao.classList.add(
                "errada"
              );
            }
          }
        );

      const area =
        $("respostaCorreta");

      area.innerHTML =
        `Resposta correta: <strong>${escaparHtml(
          textoCorreto
        )}</strong><br>${acertou
          ? `Você ganhou ${pontos} pontos.`
          : "Você não ganhou pontos nesta pergunta."
        }`;

      area.classList.remove(
        "oculto"
      );
    }

    async function revelarRespostaSala() {
      bloquearAlternativas();

      const { data } =
        await sb.rpc(
          "obter_resposta_correta",
          {
            p_pergunta_id:
              perguntaAtualId
          }
        );

      if (
        !data ||
        !data.length
      ) {
        return;
      }

      mostrarRespostaLocal(
        data[0].correta,
        data[0].alternativa_texto,
        alternativaEscolhida ===
          data[0].correta,
        pontosRecebidos || 0
      );
    }

    function atualizarCronometroIndividual() {
      if (
        !perguntaAtual ||
        !inicioPergunta
      ) {
        return;
      }

      const restante =
        Math.max(
          0,
          perguntaAtual.tempo_segundos -
          Math.floor(
            (
              Date.now() -
              inicioPergunta
            ) / 1000
          )
        );

      $("tempo")
        .textContent =
          String(restante)
            .padStart(
              2,
              "0"
            );
    }

    function atualizarCronometroSala(
      estado
    ) {
      inicioPergunta =
        new Date(
          estado.iniciada_em
        ).getTime();

      atualizarCronometroIndividual();
    }

    async function carregarParticipantes() {
      if (
        configuracao.modo !==
        "sala"
      ) {
        return;
      }

      const { data } =
        await sb.rpc(
          "obter_participantes_sala"
        );

      const lista =
        $("listaParticipantes");

      lista.innerHTML =
        "";

      (data || [])
        .forEach(
          function (
            participante
          ) {
            const item =
              document.createElement(
                "div"
              );

            item.className =
              "participante";

            item.textContent =
              participante.nome;

            lista.appendChild(
              item
            );
          }
        );
    }

    async function carregarRanking() {
      const deveMostrar =
        configuracao.modo ===
          "individual"
          ? configuracao
              .mostrar_ranking_durante
          : !$("telaFim")
              .classList.contains(
                "oculto"
              );

      if (!deveMostrar) {
        $("secaoRanking")
          .classList.add(
            "oculto"
          );

        return;
      }

      const { data, error } =
        await sb.rpc(
          "obter_ranking_quiz"
        );

      if (error) {
        mensagem(
          $("mensagemRanking"),
          error.message,
          "erro"
        );

        return;
      }

      const ranking =
        $("ranking");

      const fragmento =
        document.createDocumentFragment();

      (data || [])
        .forEach(
          function (
            resultado,
            indice
          ) {
            const linha =
              document.createElement(
                "article"
              );

            linha.className =
              "linha-ranking";

            linha.innerHTML =
              `
                <span class="posicao">
                  ${indice + 1}
                </span>

                <span class="nome-ranking"></span>

                <span class="pontos-ranking">
                  ${resultado.pontos} pts
                </span>

                <span class="dados-ranking">
                  ${resultado.acertos} acertos
                </span>
              `;

            linha.querySelector(
              ".nome-ranking"
            ).textContent =
              resultado.nome;

            fragmento.appendChild(
              linha
            );
          }
        );

      ranking.replaceChildren(
        fragmento
      );

      $("secaoRanking")
        .classList.remove(
          "oculto"
        );
    }

    function bloquearAlternativas() {
      document
        .querySelectorAll(
          ".alternativa"
        )
        .forEach(
          function (botao) {
            botao.disabled =
              true;
          }
        );
    }

    function mostrarTela(
      tipo
    ) {
      [
        "telaSala",
        "telaPergunta",
        "telaFim"
      ].forEach(
        function (id) {
          $(id)
            .classList.add(
              "oculto"
            );
        }
      );

      if (tipo === "sala") {
        $("telaSala")
          .classList.remove(
            "oculto"
          );
      }

      if (tipo === "pergunta") {
        $("telaPergunta")
          .classList.remove(
            "oculto"
          );
      }

      if (tipo === "fim") {
        $("telaFim")
          .classList.remove(
            "oculto"
          );
      }
    }

    function mostrarTelaNome() {
      [
        "telaSala",
        "telaPergunta",
        "telaFim",
        "secaoRanking"
      ].forEach(
        function (id) {
          $(id)
            .classList.add(
              "oculto"
            );
        }
      );

      $("telaNome")
        .classList.remove(
          "oculto"
        );
    }

    function limparParticipante() {
      participanteId =
        "";

      localStorage.removeItem(
        "quiz_participante_id"
      );
    }

    function mensagem(
      elemento,
      texto,
      tipo
    ) {
      elemento.textContent =
        texto;

      elemento.className =
        `mensagem ${tipo}`;
    }

    function limparMensagem(
      elemento
    ) {
      elemento.textContent =
        "";

      elemento.className =
        "mensagem";
    }

    function escaparHtml(
      texto
    ) {
      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        texto;

      return div.innerHTML;
    }
  </script>
</body>
</html>
