<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Administração - Anayad
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
      :root {
        --vinho: #7b1e4f;
        --vinho-escuro: #5d1239;
        --rosa: #a84373;
        --rosa-claro: #f3e2eb;
        --creme: #fdfbf7;
        --texto: #4a1c31;
        --texto-suave: #7c5367;
        --branco: #ffffff;
        --borda: rgba(123, 30, 79, 0.16);
        --sombra: rgba(74, 28, 49, 0.1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        font-family: "Montserrat", sans-serif;
        color: var(--texto);
        background:
        radial-gradient(
        circle at top left,
        rgba(168, 67, 115, 0.13),
        transparent 28%
        ),
        linear-gradient(
        135deg,
        #f6ece8 0%,
        #ecd8e1 48%,
        #dfbdcd 100%
        );
        background-attachment: fixed;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .oculto {
        display: none !important;
      }
      /* ==========================================================
      LOGIN
      ========================================================== */
      .tela-login {
        min-height: 100vh;
        padding: 20px 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cartao-login {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: 100%;
        max-width: 470px;
        padding: 58px 38px 40px;
        text-align: center;
        background: var(--creme);
        border: 1px solid var(--borda);
        border-radius: 180px 180px 24px 24px;
        box-shadow: 0 22px 55px rgba(74, 28, 49, 0.14);
      }
      .cartao-login::before {
        content: "";
        position: absolute;
        inset: 11px;
        z-index: -1;
        border: 1px solid rgba(123, 30, 79, 0.22);
        border-radius: 170px 170px 16px 16px;
      }
      .icone-login {
        width: 74px;
        height: 74px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        color: var(--branco);
        background: linear-gradient(
        145deg,
        var(--rosa),
        var(--vinho)
        );
        border-radius: 50%;
        font-size: 1.7rem;
      }
      h1,
      h2,
      h3 {
        color: var(--vinho);
        font-family: "Cormorant Garamond", serif;
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 3.8rem);
        line-height: 0.95;
      }
      .subtitulo {
        max-width: 360px;
        margin: 15px auto 26px;
        color: var(--texto-suave);
        font-size: 0.76rem;
        line-height: 1.7;
      }
      .campo {
        margin-bottom: 15px;
        text-align: left;
      }
      .campo label {
        display: block;
        margin-bottom: 7px;
        color: var(--vinho-escuro);
        font-size: 0.67rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .campo input {
        width: 100%;
        min-height: 48px;
        padding: 12px 13px;
        color: var(--texto);
        background: var(--branco);
        border: 1px solid rgba(123, 30, 79, 0.22);
        border-radius: 9px;
        outline: none;
      }
      .campo input:focus {
        border-color: var(--vinho);
        box-shadow: 0 0 0 3px rgba(123, 30, 79, 0.08);
      }
      .botao {
        min-height: 46px;
        padding: 11px 17px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .botao-principal {
        width: 100%;
        color: var(--branco);
        background: var(--vinho);
        border: 1px solid var(--vinho);
      }
      .botao-secundario {
        color: var(--vinho);
        background: transparent;
        border: 1px solid rgba(123, 30, 79, 0.3);
      }
      .mensagem {
        display: none;
        margin-top: 14px;
        padding: 13px;
        border-radius: 9px;
        font-size: 0.72rem;
        line-height: 1.5;
      }
      .mensagem.erro {
        display: block;
        color: #9c3458;
        background: #ffe4ec;
      }
      /* ==========================================================
      PAINEL PRINCIPAL
      ========================================================== */
      .aplicacao {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
      }
      .menu-lateral {
        min-height: 100vh;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        background: rgba(253, 251, 247, 0.97);
        border-right: 1px solid var(--borda);
        box-shadow: 7px 0 24px rgba(74, 28, 49, 0.06);
      }
      .marca {
        padding: 8px 10px 24px;
        border-bottom: 1px solid rgba(123, 30, 79, 0.1);
      }
      .marca h2 {
        font-size: 2rem;
        line-height: 1;
      }
      .marca p {
        margin-top: 6px;
        color: var(--texto-suave);
        font-size: 0.64rem;
        line-height: 1.5;
      }
      .navegacao {
        margin-top: 20px;
        display: grid;
        gap: 8px;
      }
      .item-menu {
        width: 100%;
        min-height: 54px;
        padding: 10px 12px;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        color: var(--texto);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        text-align: left;
        transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
      }
      .item-menu:hover {
        background: rgba(243, 226, 235, 0.48);
        border-color: rgba(123, 30, 79, 0.13);
      }
      .item-menu.ativo {
        color: var(--vinho);
        background: var(--rosa-claro);
        border-color: rgba(123, 30, 79, 0.2);
      }
      .icone-menu {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        color: var(--vinho);
        background: var(--branco);
        border-radius: 10px;
        font-size: 1rem;
      }
      .item-menu strong {
        display: block;
        font-size: 0.7rem;
        font-weight: 600;
      }
      .item-menu small {
        display: block;
        margin-top: 2px;
        color: var(--texto-suave);
        font-size: 0.55rem;
        line-height: 1.3;
      }
      .menu-rodape {
        margin-top: auto;
        padding-top: 18px;
        display: grid;
        gap: 8px;
        border-top: 1px solid rgba(123, 30, 79, 0.1);
      }
      /* ==========================================================
      CONTEÚDO
      ========================================================== */
      .conteudo {
        min-width: 0;
        padding: 18px;
      }
      .topo {
        margin-bottom: 14px;
        padding: 17px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: rgba(253, 251, 247, 0.95);
        border: 1px solid var(--borda);
        border-radius: 18px;
      }
      .topo h2 {
        font-size: 2rem;
        line-height: 1;
      }
      .topo p {
        margin-top: 4px;
        color: var(--texto-suave);
        font-size: 0.65rem;
      }
      .seletor-mobile {
        display: none;
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        color: var(--texto);
        background: var(--branco);
        border: 1px solid rgba(123, 30, 79, 0.22);
        border-radius: 10px;
      }
      .moldura {
        width: 100%;
        height: calc(100vh - 118px);
        overflow: hidden;
        background: var(--creme);
        border: 1px solid var(--borda);
        border-radius: 18px;
        box-shadow: 0 12px 28px var(--sombra);
      }
      .moldura iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        background: var(--creme);
      }
      @media (max-width: 850px) {
        .aplicacao {
          display: block;
        }
        .menu-lateral {
          display: none;
        }
        .conteudo {
          padding: 10px;
        }
        .topo {
          align-items: flex-start;
          flex-direction: column;
        }
        .seletor-mobile {
          display: block;
        }
        .moldura {
          height: calc(100vh - 170px);
        }
      }
      @media (max-width: 520px) {
        .cartao-login {
          padding: 54px 20px 30px;
          border-radius: 155px 155px 20px 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ========================================================
       LOGIN ÚNICO
       ======================================================== -->
    <section class="tela-login" id="telaLogin">
      <div class="cartao-login">
        <div class="icone-login">
          ✦
        </div>
        <h1>
          Administração Anayad
        </h1>
        <p class="subtitulo">
          Entre uma única vez para acessar todas as áreas administrativas.
        </p>
        <form id="formLogin">
          <div class="campo">
            <label for="email">
              E-mail
            </label>
            <input
            type="email"
            id="email"
            autocomplete="email"
            required
          >
          </div>
          <div class="campo">
            <label for="senha">
              Senha
            </label>
            <input
            type="password"
            id="senha"
            autocomplete="current-password"
            required
          >
          </div>
          <button
          class="botao botao-principal"
          type="submit"
          id="botaoLogin"
        >
            Entrar
          </button>
          <p
          id="mensagemLogin"
          class="mensagem"
          aria-live="polite"
        >
          </p>
        </form>
      </div>
    </section>
    <!-- ========================================================
       ÁREA ADMINISTRATIVA
       ======================================================== -->
    <main class="aplicacao oculto" id="aplicacao">
      <aside class="menu-lateral">
        <div class="marca">
          <h2>
            Anayad
          </h2>
          <p>
            Central de administração do convite
          </p>
        </div>
        <nav class="navegacao">
          <button
          class="item-menu ativo"
          data-pagina="painel.html?embed=1"
          data-titulo="Confirmações"
          data-descricao="Quem vai, quem não vai e exportação de respostas."
        >
            <span class="icone-menu">
              ✓
            </span>
            <span>
              <strong>
                Confirmações
              </strong>
              <small>
                Presenças e respostas
              </small>
            </span>
          </button>
          <button
          class="item-menu"
          data-pagina="administrar_presentes.html?embed=1"
          data-titulo="Presentes"
          data-descricao="Adicionar, editar, ocultar ou apagar opções de presentes."
        >
            <span class="icone-menu">
              🎁
            </span>
            <span>
              <strong>
                Presentes
              </strong>
              <small>
                Lista de opções
              </small>
            </span>
          </button>
          <button
          class="item-menu"
          data-pagina="administrar_musicas.html?embed=1"
          data-titulo="Músicas"
          data-descricao="Revisar, aprovar ou apagar sugestões de músicas."
        >
            <span class="icone-menu">
              ♫
            </span>
            <span>
              <strong>
                Músicas
              </strong>
              <small>
                Sugestões da playlist
              </small>
            </span>
          </button>
          <button
          class="item-menu"
          data-pagina="administrar_mural.html?embed=1"
          data-titulo="Mural de fotos"
          data-descricao="Visualizar, aprovar, ocultar ou apagar fotos."
        >
            <span class="icone-menu">
              ▣
            </span>
            <span>
              <strong>
                Mural
              </strong>
              <small>
                Fotos e recados
              </small>
            </span>
          </button>
          <button
          class="item-menu"
          data-pagina="administrar_quiz.html?embed=1"
          data-titulo="Quiz"
          data-descricao="Criar perguntas, controlar o tempo e acompanhar o jogo."
        >
            <span class="icone-menu">
              ?
            </span>
            <span>
              <strong>
                Quiz
              </strong>
              <small>
                Perguntas e ranking
              </small>
            </span>
          </button>
        </nav>
        <div class="menu-rodape">
          <a
          class="botao botao-secundario"
          href="index.html"
          target="_blank"
        >
            Abrir convite
          </a>
          <button
          class="botao botao-secundario"
          id="botaoSair"
        >
            Sair
          </button>
        </div>
      </aside>
      <section class="conteudo">
        <header class="topo">
          <div>
            <h2 id="tituloPagina">
              Confirmações
            </h2>
            <p id="descricaoPagina">
              Quem vai, quem não vai e exportação de respostas.
            </p>
          </div>
          <select
          class="seletor-mobile"
          id="seletorMobile"
          aria-label="Escolher área administrativa"
        >
            <option value="painel.html?embed=1">
              Confirmações
            </option>
            <option value="administrar_presentes.html?embed=1">
              Presentes
            </option>
            <option value="administrar_musicas.html?embed=1">
              Músicas
            </option>
            <option value="administrar_mural.html?embed=1">
              Mural de fotos
            </option>
            <option value="administrar_quiz.html?embed=1">
              Quiz
            </option>
          </select>
        </header>
        <section class="moldura">
          <iframe
          id="frameAdministracao"
          src="painel.html?embed=1"
          title="Área administrativa"
        >
          </iframe>
        </section>
      </section>
    </main>
    <script>
      /*
            ============================================================
            CONFIGURAÇÃO DO SUPABASE
            ============================================================
            Use a mesma Project URL e Publishable key dos outros arquivos.
          */
          const SUPABASE_URL =
                "https://ywkgwctaaipwcyohomdj.supabase.co";
          const SUPABASE_KEY =
              "sb_publishable_zLcSs35Cps1zW0ncBW5qxw_zv-c3Ekt";
          const clienteSupabase =
            window.supabase.createClient(
              SUPABASE_URL,
              SUPABASE_KEY
            );
          const telaLogin =
            document.getElementById("telaLogin");
          const aplicacao =
            document.getElementById("aplicacao");
          const formularioLogin =
            document.getElementById("formLogin");
          const mensagemLogin =
            document.getElementById("mensagemLogin");
          const botaoLogin =
            document.getElementById("botaoLogin");
          const frame =
            document.getElementById("frameAdministracao");
          const tituloPagina =
            document.getElementById("tituloPagina");
          const descricaoPagina =
            document.getElementById("descricaoPagina");
          const seletorMobile =
            document.getElementById("seletorMobile");
          const paginas = {
            "painel.html?embed=1": {
              titulo:
                "Confirmações",
              descricao:
                "Quem vai, quem não vai e exportação de respostas."
            },
            "administrar_presentes.html?embed=1": {
              titulo:
                "Presentes",
              descricao:
                "Adicionar, editar, ocultar ou apagar opções de presentes."
            },
            "administrar_musicas.html?embed=1": {
              titulo:
                "Músicas",
              descricao:
                "Revisar, aprovar ou apagar sugestões de músicas."
            },
            "administrar_mural.html?embed=1": {
              titulo:
                "Mural de fotos",
              descricao:
                "Visualizar, aprovar, ocultar ou apagar fotos."
            },
            "administrar_quiz.html?embed=1": {
              titulo:
                "Quiz",
              descricao:
                "Criar perguntas, controlar o tempo e acompanhar o jogo."
            }
          };
          iniciar();
          async function iniciar() {
            const { data, error } =
              await clienteSupabase
                .auth
                .getSession();
            if (error) {
              mostrarErro(
                "Erro ao verificar a sessão: " +
                error.message
              );
              return;
            }
            if (data.session) {
              abrirAplicacao();
            }
          }
          formularioLogin.addEventListener(
            "submit",
            async function (evento) {
              evento.preventDefault();
              botaoLogin.disabled = true;
              botaoLogin.textContent =
                "Entrando...";
              const { error } =
                await clienteSupabase
                  .auth
                  .signInWithPassword({
                    email:
                      document
                        .getElementById("email")
                        .value
                        .trim(),
                    password:
                      document
                        .getElementById("senha")
                        .value
                  });
              botaoLogin.disabled = false;
              botaoLogin.textContent =
                "Entrar";
              if (error) {
                mostrarErro(
                  "Não foi possível entrar: " +
                  error.message
                );
                return;
              }
              abrirAplicacao();
              abrirPagina("painel.html?embed=1");
            }
          );
          document
            .querySelectorAll(".item-menu")
            .forEach(
              function (botao) {
                botao.addEventListener(
                  "click",
                  function () {
                    abrirPagina(
                      this.dataset.pagina
                    );
                  }
                );
              }
            );
          seletorMobile.addEventListener(
            "change",
            function () {
              abrirPagina(this.value);
            }
          );
          document
            .getElementById("botaoSair")
            .addEventListener(
              "click",
              async function () {
                await clienteSupabase
                  .auth
                  .signOut();
                aplicacao.classList.add("oculto");
                telaLogin.classList.remove("oculto");
                document
                  .getElementById("senha")
                  .value = "";
              }
            );
          function abrirAplicacao() {
            telaLogin.classList.add("oculto");
            aplicacao.classList.remove("oculto");
          }
          function abrirPagina(pagina) {
            const separador = pagina.includes("?") ? "&" : "?";
            frame.src =
              pagina +
              separador +
              "v=" +
              Date.now();
            seletorMobile.value =
              pagina;
            const dados =
              paginas[pagina];
            tituloPagina.textContent =
              dados.titulo;
            descricaoPagina.textContent =
              dados.descricao;
            document
              .querySelectorAll(".item-menu")
              .forEach(
                function (botao) {
                  botao.classList.toggle(
                    "ativo",
                    botao.dataset.pagina === pagina
                  );
                }
              );
          }
          function mostrarErro(texto) {
            mensagemLogin.textContent =
              texto;
            mensagemLogin.className =
              "mensagem erro";
          }
    </script>
  </body>
</html>
