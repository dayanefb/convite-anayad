<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirmar presença - Anayad</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --rosa-escuro: #7b1e4f;
      --rosa-profundo: #5d1239;
      --rosa-medio: #a84373;
      --rosa-suave: #f3e2eb;
      --papel: #fdfbf7;
      --texto: #4a1c31;
      --branco: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Montserrat", sans-serif;
      color: var(--texto);
      background: linear-gradient(
        135deg,
        #f5ebe6 0%,
        #ebd4df 50%,
        #dfb8ca 100%
      );
      background-attachment: fixed;
    }

    .pagina-confirmacao {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .cartao-confirmacao {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      padding: 58px 38px 40px;
      text-align: center;
      background: var(--papel);
      border: 1px solid rgba(123, 30, 79, 0.18);
      border-radius: 180px 180px 24px 24px;
      box-shadow: 0 25px 50px rgba(74, 28, 49, 0.15);
    }

    .cartao-confirmacao::before {
      content: "";
      position: absolute;
      inset: 11px;
      z-index: -1;
      border: 1px solid rgba(123, 30, 79, 0.22);
      border-radius: 170px 170px 16px 16px;
      pointer-events: none;
    }

    .conteudo {
      position: relative;
      z-index: 1;
    }

    .estrelas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--rosa-medio);
    }

    .estrela-pequena {
      font-size: 0.9rem;
    }

    .estrela-grande {
      font-size: 1.8rem;
      line-height: 1;
    }

    h1 {
      max-width: 420px;
      margin: 0 auto;
      color: var(--rosa-escuro);
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(2.5rem, 9vw, 3.8rem);
      font-weight: 700;
      line-height: 1;
    }

    .descricao {
      max-width: 360px;
      margin: 14px auto 30px;
      color: var(--texto);
      font-size: 0.82rem;
      line-height: 1.7;
    }

    .campo {
      margin-bottom: 19px;
      text-align: left;
    }

    .campo label,
    .pergunta {
      display: block;
      margin-bottom: 8px;
      color: var(--rosa-profundo);
      font-size: 0.71rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .campo input {
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      color: var(--texto);
      background: #ffffff;
      border: 1px solid rgba(123, 30, 79, 0.25);
      border-radius: 8px;
      outline: none;
      font-family: "Montserrat", sans-serif;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .campo input:focus {
      border-color: var(--rosa-escuro);
      box-shadow: 0 0 0 3px rgba(123, 30, 79, 0.12);
    }

    .opcoes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .opcao {
      position: relative;
      min-width: 0;
    }

    .opcao input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .opcao label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 12px 10px;
      color: var(--rosa-escuro);
      background: transparent;
      border: 1px solid rgba(123, 30, 79, 0.35);
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .opcao label:hover {
      background: rgba(123, 30, 79, 0.06);
      transform: translateY(-1px);
    }

    .opcao input:checked + label {
      color: var(--branco);
      background: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
      box-shadow: 0 4px 10px rgba(123, 30, 79, 0.2);
    }

    .botao-enviar,
    .botao-voltar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      padding: 13px 20px;
      border-radius: 50px;
      font-family: "Montserrat", sans-serif;
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .botao-enviar {
      color: var(--branco);
      background: var(--rosa-escuro);
      border: 1px solid var(--rosa-escuro);
      box-shadow: 0 4px 12px rgba(123, 30, 79, 0.25);
    }

    .botao-enviar:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .botao-voltar {
      margin-top: 11px;
      color: var(--rosa-escuro);
      background: transparent;
      border: 1px solid rgba(123, 30, 79, 0.4);
    }

    .mensagem {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.6;
      text-align: center;
    }

    .mensagem.erro {
      display: block;
      color: #8b1f42;
      background: rgba(255, 226, 233, 0.85);
      border: 1px solid rgba(139, 31, 66, 0.3);
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
      }

      .cartao-confirmacao {
        padding: 54px 20px 30px;
        border-radius: 160px 160px 20px 20px;
      }

      .cartao-confirmacao::before {
        inset: 8px;
        border-radius: 150px 150px 12px 12px;
      }

      .opcoes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="pagina-confirmacao">
    <section class="cartao-confirmacao">
      <div class="conteudo">
        <div class="estrelas" aria-hidden="true">
          <span class="estrela-pequena">✦</span>
          <span class="estrela-grande">✷</span>
          <span class="estrela-pequena">✦</span>
        </div>

        <h1>Confirme sua presença</h1>

        <p class="descricao">
          Informe se você estará presente no aniversário da Anayad.
        </p>

        <form id="formConfirmacao">
          <div class="campo">
            <label for="nomeConvidado">Seu nome completo</label>

            <input
              type="text"
              id="nomeConvidado"
              maxlength="100"
              placeholder="Digite seu nome"
              autocomplete="name"
              required
            >
          </div>

          <div class="campo">
            <span class="pergunta">Você irá ao aniversário?</span>

            <div class="opcoes">
              <div class="opcao">
                <input
                  type="radio"
                  id="presencaSim"
                  name="presenca"
                  value="sim"
                  required
                >
                <label for="presencaSim">Sim, estarei presente</label>
              </div>

              <div class="opcao">
                <input
                  type="radio"
                  id="presencaNao"
                  name="presenca"
                  value="nao"
                  required
                >
                <label for="presencaNao">Não poderei comparecer</label>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="botao-enviar"
            id="botaoEnviar"
          >
            Enviar confirmação
          </button>

          <a href="index.html" class="botao-voltar">
            Voltar para o convite
          </a>

          <p
            id="mensagemConfirmacao"
            class="mensagem"
            aria-live="polite"
          ></p>
        </form>
      </div>
    </section>
  </main>

  <script>
    /*
      SUBSTITUA APENAS OS DOIS VALORES ABAIXO.
      Use a Project URL e a Publishable key do Supabase.
    */
    const SUPABASE_URL =
      "https://ywkgwctaaipwcyohomdj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zLcSs35Cps1zW0ncBW5qxw_zv-c3Ekt";

    const mensagem =
      document.getElementById("mensagemConfirmacao");

    const formulario =
      document.getElementById("formConfirmacao");

    const botaoEnviar =
      document.getElementById("botaoEnviar");

    let clienteSupabase = null;

    try {
      clienteSupabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
    } catch (erro) {
      console.error("Erro ao criar cliente Supabase:", erro);
    }

    formulario.addEventListener(
      "submit",
      async function (evento) {
        evento.preventDefault();

        limparMensagem();

        const nome = document
          .getElementById("nomeConvidado")
          .value
          .trim();

        const presencaSelecionada =
          document.querySelector(
            'input[name="presenca"]:checked'
          );

        if (nome.length < 2) {
          mostrarErro("Digite seu nome para continuar.");
          return;
        }

        if (!presencaSelecionada) {
          mostrarErro(
            "Informe se você irá ao aniversário."
          );
          return;
        }

        if (
          SUPABASE_URL.includes("COLE_AQUI") ||
          SUPABASE_KEY.includes("COLE_AQUI")
        ) {
          mostrarErro(
            "O Supabase ainda não foi configurado neste arquivo."
          );
          return;
        }

        if (!clienteSupabase) {
          mostrarErro(
            "Não foi possível conectar ao Supabase."
          );
          return;
        }

        botaoEnviar.disabled = true;
        botaoEnviar.textContent = "Salvando confirmação...";

        const presenca = presencaSelecionada.value;

        try {
          const { error } = await clienteSupabase
            .from("confirmacoes")
            .insert({
              nome: nome,
              presenca: presenca
            });

          if (error) {
            throw error;
          }

          const parametros = new URLSearchParams({
            nome: nome,
            resposta: presenca
          });

          window.location.href =
            `confirmacao.html?${parametros.toString()}`;
        } catch (erro) {
          console.error("Erro completo do Supabase:", erro);

          mostrarErro(
            "Não foi possível salvar. Detalhe: " +
            (erro.message || "erro desconhecido")
          );

          botaoEnviar.disabled = false;
          botaoEnviar.textContent = "Enviar confirmação";
        }
      }
    );

    function mostrarErro(texto) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem erro";
    }

    function limparMensagem() {
      mensagem.textContent = "";
      mensagem.className = "mensagem";
    }
  </script>
</body>
</html>
